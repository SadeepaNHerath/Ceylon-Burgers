<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS · Ceylon Burgers</title>
  <link rel="icon" href="icon/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="pos-body">
  <div class="pos-app">
    <header class="pos-top">
      <span class="brand">
        <img src="icon/android-chrome-192x192.png" alt="">
        POS
      </span>
      <div class="pos-stats">
        <div>Today <strong id="stat-sales">LKR 0</strong></div>
        <div>Orders <strong id="stat-orders">0</strong></div>
      </div>
      <div class="pos-user">
        <span id="user-label"></span>
        <button class="btn btn-ghost" id="btn-orders" type="button">Today’s tickets</button>
        <a class="btn btn-ghost" id="admin-link" href="admin.html" hidden>Admin</a>
        <button class="btn btn-danger" id="btn-logout" type="button">Logout</button>
      </div>
    </header>

    <div class="pos-shell">
      <aside class="pos-cats" id="categories"></aside>
      <section class="pos-menu">
        <div class="pos-tools">
          <input id="search" placeholder="Search menu…" autocomplete="off">
        </div>
        <div class="tile-grid" id="tiles"></div>
      </section>
      <aside class="ticket">
        <div class="ticket-head">
          <div class="customer-box">
            <label class="field">
              <span>Customer</span>
              <input id="customer-search" placeholder="Walk-in or search name / phone" autocomplete="off">
            </label>
            <div id="customer-suggest"></div>
            <div class="muted" id="customer-label">Walk-in</div>
          </div>
        </div>
        <div class="ticket-lines" id="lines"></div>
        <div class="ticket-pay">
          <div class="totals">
            <div><span>Subtotal</span><span id="subtotal">LKR 0</span></div>
            <div><span>Discounts</span><span id="discounts">LKR 0</span></div>
            <div class="grand"><span>Total</span><span id="total">LKR 0</span></div>
          </div>
          <button class="btn btn-amber btn-wide" id="btn-pay" type="button" disabled>Take payment</button>
          <button class="btn btn-ghost btn-wide" id="btn-clear" type="button" style="margin-top: 0.5rem;">Clear ticket</button>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal" id="pay-modal">
    <div class="modal-card">
      <h2>Cash payment</h2>
      <p class="muted">Due <strong id="pay-due">LKR 0</strong></p>
      <label class="field" style="margin: 1rem 0;">
        <span>Cash received</span>
        <input id="tendered" type="number" min="0" step="1">
      </label>
      <p>Change <strong id="pay-change">LKR 0</strong></p>
      <p class="error" id="pay-error" hidden></p>
      <div class="toolbar" style="margin-top: 1rem;">
        <button class="btn btn-amber" id="btn-complete" type="button">Complete sale</button>
        <button class="btn btn-ghost" id="btn-cancel-pay" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <div class="modal" id="orders-modal">
    <div class="modal-card" style="width: min(520px, 100%);">
      <h2>Today’s tickets</h2>
      <div id="orders-list" class="table-wrap" style="margin: 1rem 0;"></div>
      <button class="btn btn-ghost" id="btn-close-orders" type="button">Close</button>
    </div>
  </div>

  <div class="modal" id="receipt-modal">
    <div>
      <div class="receipt" id="print-receipt"></div>
      <div class="toolbar" style="margin-top: 0.8rem;">
        <button class="btn btn-amber" id="btn-print" type="button">Print receipt</button>
        <button class="btn btn-ghost" id="btn-new-sale" type="button">New sale</button>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pos.js"></script>
</body>
</html>
