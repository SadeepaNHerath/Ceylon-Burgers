<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff login · Ceylon Burgers</title>
  <link rel="icon" href="icon/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
  <form class="login-card" id="login-form">
    <a class="brand" href="index.html" style="margin-bottom: 1.2rem;">
      <img src="icon/android-chrome-192x192.png" alt="">
      Ceylon Burgers
    </a>
    <h1>Staff login</h1>
    <p class="muted">Cashiers open the POS. Admins open the back office.</p>
    <div class="error" id="error" hidden></div>
    <div class="field" style="margin-top: 1rem;">
      <span>Username</span>
      <input name="username" autocomplete="username" required>
    </div>
    <div class="field" style="margin: 0.8rem 0 1.2rem;">
      <span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-amber btn-wide" type="submit">Sign in</button>
    <p class="muted" style="margin-top: 1rem;"><a href="index.html">Back to menu</a></p>
  </form>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
