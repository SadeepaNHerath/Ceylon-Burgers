<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu · Ceylon Burgers</title>
  <link rel="icon" href="icon/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header">
    <span class="brand">
      <img src="icon/android-chrome-192x192.png" alt="">
      Ceylon Burgers
    </span>
    <div id="header-action"></div>
  </header>

  <section class="hero">
    <div>
      <p class="chip">Colombo · order at the counter</p>
      <h1>Burgers, subs and sides made for the street.</h1>
      <p>Prices below. Tell the cashier what you want — we do not take orders on this page.</p>
      <div class="hours">
        <div>
          <strong>Open daily</strong>
          <div class="muted">11:00 AM – 10:30 PM</div>
        </div>
        <div>
          <strong>Pay at the register</strong>
          <div class="muted">Cash</div>
        </div>
      </div>
    </div>
    <div class="hero-card">
      <img src="img/items.webp" alt="Ceylon Burgers spread">
    </div>
  </section>

  <main class="menu-section" id="menu"></main>

  <footer class="site-footer">
    <span>© <span id="year"></span> Ceylon Burgers</span>
  </footer>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
