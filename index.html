<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceylon Burgers - Login</title>
  <link rel="icon" href="icon/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.1/aos.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <!-- Content Security Policy to enforce HTTPS -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <!-- Add security headers for XSS protection -->
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  
  <style>
    .password-container {
      position: relative;
    }
    #password-strength {
      height: 5px;
      background-color: #ccc;
      margin-top: 5px;
      transition: all 0.3s ease;
      width: 0;
    }
    .security-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 15px;
      border-radius: 30px;
      font-size: 14px;
      color: white;
      display: flex;
      align-items: center;
      gap: 7px;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .secure {
      background-color: #28a745;
    }
    .insecure {
      background-color: #dc3545;
    }
  </style>
</head>

<body>
  <div id="security-status"></div>
  
  <div class="container d-flex justify-content-center align-items-center vh-100" data-aos="fade-up">
    <div class="card shadow" style="width: 400px;">
      <div class="card-body p-4">
        <h2 class="text-center mb-4">
          <i class="fas fa-user-circle"></i> Login to Ceylon Burgers
        </h2>
        <div class="mb-3">
          <label for="roleSelect" class="form-label">Select your role:</label>
          <select id="roleSelect" class="form-select" onchange="updatePasswordPlaceholder()">
            <option value="">Choose...</option>
            <option value="admin">Admin</option>
            <option value="cashier">Cashier</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="cashierSelect" class="form-label" id="cashierLabel" style="display: none;">Select Cashier:</label>
          <select id="cashierSelect" class="form-select" style="display: none;">
            <option value="">Choose...</option>
            <!-- Cashier options will be populated by JavaScript -->
          </select>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" placeholder="Enter password">
            <span class="input-group-text toggle-password" style="cursor: pointer;">
              <i class="far fa-eye"></i>
            </span>
          </div>
          <div id="password-strength"></div>
          <div id="strength-label"></div>
        </div>
        <div class="text-center">
          <button class="btn btn-danger" onclick="checkLogin()">Login</button>
        </div>
        <div id="error-message" class="text-danger text-center mt-3"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.1/aos.js"></script>
  <!-- Load the utilities.js first to make security functions available -->
  <script src="utilities.js"></script>
  <script src="app.js"></script>
  <script>
    AOS.init();
    
    document.addEventListener('DOMContentLoaded', function() {
      // Display security status badge
      const securityStatus = document.getElementById('security-status');
      if (window.location.protocol === 'https:') {
        securityStatus.innerHTML = '<div class="security-badge secure"><i class="fas fa-lock"></i>Secure Connection</div>';
      } else {
        securityStatus.innerHTML = '<div class="security-badge insecure"><i class="fas fa-unlock"></i>Insecure Connection</div>';
      }
    });
    
    // Toggle password visibility
    document.querySelector('.toggle-password').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    });
  </script>
</body>

</html>
